<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>11:00 — Werewolf Protocol</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0d;color:#eee;font-family:Arial,sans-serif}
body{touch-action:none}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:none;
background:#11151bcc;border:1px solid #555;padding:7px 14px;border-radius:8px;
font-weight:bold;z-index:5;white-space:nowrap}
#clock{font-size:22px;color:#f4d27a}
#hint{font-size:12px;color:#aaa;margin-right:12px}
#msg{position:fixed;top:65px;left:50%;transform:translateX(-50%);display:none;
width:min(92%,620px);padding:10px;text-align:center;background:#111b;border:1px solid #444;border-radius:8px;z-index:5}
#start,#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle,#24262c,#08090b 70%);z-index:20}
.panel{width:min(92%,600px);padding:30px;text-align:center;border:1px solid #555;
background:#111318f2;box-shadow:0 0 50px #000;border-radius:12px}
h1{margin:0 0 10px;font-size:38px;letter-spacing:2px}
p{line-height:1.7;color:#bbb}
button{border:1px solid #777;background:#20242b;color:#fff;padding:13px 28px;
font-size:18px;border-radius:7px;cursor:pointer}
button:hover{background:#303640}
#end{display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="clock">11:00</span><span id="hint">— اقرأ الرسالتين المشفرتين ثم اختر من تقتله</span></div>
<div id="msg"></div>

<div id="start">
  <div class="panel">
    <h1>11:00</h1>
    <p>
      شخصان معك في الغرفة.<br>
      واحد منهما مستذئب، لكن العلامة ليست واضحة.<br>
      أمامك <b>60 ثانية</b> لقراءة الرسالتين المشفرتين واستنتاج الحقيقة.
    </p>
    <p>بعدها اختر شخصاً لقتله. إن أخطأت، يتحول الآخر إلى مستذئب.</p>
    <button id="startBtn">ابدأ</button>
  </div>
</div>

<div id="end">
  <div class="panel">
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <button onclick="location.reload()">إعادة اللعب</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const hud=document.getElementById("hud"),clock=document.getElementById("clock"),msg=document.getElementById("msg");
const start=document.getElementById("start"),end=document.getElementById("end");
const endTitle=document.getElementById("endTitle"),endText=document.getElementById("endText");

let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();

let state="menu", timeLeft=60, last=0, selected=null, encrypted=[];
let player={x:0,y:0,angle:0,hp:100,ammo:999};
let wolf=null, humans=[], bullets=[], particles=[], keys={};
let shootCooldown=0, wolfAttack=0, gameOver=false;

const names=["Nadir","Elias"];
function rand(a,b){return Math.random()*(b-a)+a}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function makeGame(){
  player.x=W/2;player.y=H-110;
  const wolfIndex=Math.floor(Math.random()*2);
  humans=[
    {x:W*.34,y:H*.34,name:names[0],color:"#b8b8b8",alive:true,secret:false,hp:100},
    {x:W*.66,y:H*.34,name:names[1],color:"#aaa",alive:true,secret:false,hp:100}
  ];
  humans[wolfIndex].secret=true;
  wolf=wolfIndex;
  encrypted=makeMessages(wolfIndex);
  bullets=[];particles=[];selected=null;timeLeft=60;
}

function makeMessages(w){
  // Two clues are encrypted using a Caesar-style shift.
  // They intentionally give enough information to identify the correct person.
  const clues = w===0 ? [
    "NADIR يحمل علامة القمر على يده اليسرى",
    "ELIAS لا يملك العلامة"
  ] : [
    "ELIAS يحمل علامة القمر على يده اليسرى",
    "NADIR لا يملك العلامة"
  ];
  return clues.map((s,i)=>({title:"رسالة "+(i+1),raw:s,shift:3}));
}
function caesar(s,shift){
  // Arabic is kept readable; Latin letters are shifted for the cipher.
  return s.replace(/[A-Za-z]/g,c=>{
    let base=c<="Z"?65:97;return String.fromCharCode((c.charCodeAt(0)-base+shift)%26+base)
  });
}
function decode(s,shift){return caesar(s,-shift)}

function startGame(){
  start.style.display="none";hud.style.display="block";makeGame();state="investigate";last=performance.now();
  msg.style.display="block";msg.textContent="اقترب من الرسائل لقراءتها. الأسهم/WASD للحركة.";
  requestAnimationFrame(loop);
}

document.getElementById("startBtn").onclick=startGame;

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
  if(state==="investigate" && (e.key==="1"||e.key==="2")) showMessage(+e.key-1);
  if(state==="investigate" && e.key==="Enter" && selected!==null) executeChoice(selected);
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

canvas.addEventListener("pointerdown",e=>{
  if(state==="investigate"){
    const p=pointer(e);
    humans.forEach((h,i)=>{if(h.alive && Math.hypot(p.x-h.x,p.y-h.y)<65) selected=i});
    const near=nearestMessage();
    if(near>=0)showMessage(near);
  } else if(state==="fight"){
    shoot(e.clientX,e.clientY);
  }
});
canvas.addEventListener("pointermove",e=>{
  if(state==="fight" && e.buttons)shoot(e.clientX,e.clientY);
});
function pointer(e){return{x:e.clientX,y:e.clientY}}
function nearestMessage(){
  // two physical papers on opposite sides of the room
  let a={x:W*.18,y:H*.55},b={x:W*.82,y:H*.55};
  let da=Math.hypot(player.x-a.x,player.y-a.y),db=Math.hypot(player.x-b.x,player.y-b.y);
  if(Math.min(da,db)<95)return da<db?0:1;return -1;
}
function showMessage(i){
  if(timeLeft<=0)return;
  const m=encrypted[i];
  msg.innerHTML="<b>"+m.title+"</b><br><span style='font-family:monospace'>"+caesar(m.raw,m.shift)+"</span><br><small>الشفرة: -3</small><br><strong>"+decode(caesar(m.raw,m.shift),m.shift)+"</strong>";
}
function updateInvestigate(dt){
  let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);
  if(keys.ArrowRight)dx++;if(keys.ArrowLeft)dx--;if(keys.ArrowDown)dy++;if(keys.ArrowUp)dy--;
  let l=Math.hypot(dx,dy)||1;
  player.x=Math.max(35,Math.min(W-35,player.x+dx/l*190*dt));
  player.y=Math.max(105,Math.min(H-35,player.y+dy/l*190*dt));
  timeLeft-=dt;
  clock.textContent="11:"+String(Math.max(0,Math.ceil(timeLeft))).padStart(2,"0");
  if(timeLeft<=0){timeLeft=0;state="choice";msg.style.display="block";
    msg.textContent="انتهى الوقت. اضغط على أحد الشخصين لاختياره ثم ENTER."}
}
function executeChoice(i){
  selected=i;state="transition";msg.style.display="none";
  setTimeout(()=>{
    if(i===wolf){
      endTitle.textContent="نجوت.";
      endText.textContent="اخترت المستذئب الصحيح قبل أن يقتل الجميع.";
      end.style.display="flex";state="ended";
    }else{
      // The other survivor transforms into the final boss.
      const boss=1-i;
      humans[i].alive=false;
      state="fight";
      humans[boss].wolfForm=true;
      wolf=boss;
      player.x=W/2;player.y=H-100;player.hp=100;
      msg.style.display="block";msg.innerHTML="<b>خاطئ.</b> لقد أطلقت العنان للمستذئب. اهزمه.";
    }
  },600);
}

function shoot(tx,ty){
  if(state!=="fight"||shootCooldown>0)return;
  shootCooldown=.11;
  let a=Math.atan2(ty-player.y,tx-player.x);
  bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*680,vy:Math.sin(a)*680,life:1});
}
function updateFight(dt){
  let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(dx,dy)||1;
  if(keys.ArrowRight)dx++;if(keys.ArrowLeft)dx--;if(keys.ArrowDown)dy++;if(keys.ArrowUp)dy--;
  l=Math.hypot(dx,dy)||1;player.x+=dx/l*230*dt;player.y+=dy/l*230*dt;
  player.x=Math.max(25,Math.min(W-25,player.x));player.y=Math.max(85,Math.min(H-25,player.y));
  shootCooldown=Math.max(0,shootCooldown-.016);
  const h=humans[wolf]; if(!h.alive)return;
  let a=Math.atan2(player.y-h.y,player.x-h.x);
  h.x+=Math.cos(a)*95*dt;h.y+=Math.sin(a)*95*dt;
  wolfAttack-=dt;
  if(dist(player,h)<55 && wolfAttack<=0){
    player.hp-=18;wolfAttack=.55;burst(player.x,player.y,10);
    if(player.hp<=0){endTitle.textContent="ماتت.";endText.textContent="المستذئب كان أقوى منك.";end.style.display="flex";state="ended"}
  }
  bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(Math.hypot(b.x-h.x,b.y-h.y)<48){h.hp-=10;b.life=0;burst(h.x,h.y,3)}
  });
  bullets=bullets.filter(b=>b.life>0);
  if(h.hp<=0){endTitle.textContent="انتصار.";endText.textContent="هزمت المستذئب رغم قوته الهائلة.";end.style.display="flex";state="ended"}
}
function burst(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-160,160),vy:rand(-160,160),life:rand(.2,.7)})}
function updateParticles(dt){particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#0b0d10";ctx.fillRect(0,0,W,H);
  // tiled floor
  for(let x=0;x<W;x+=50)for(let y=70;y<H;y+=50){
    ctx.strokeStyle=((x/50+y/50)%2?"#171a1f":"#12151a");ctx.strokeRect(x,y,50,50)
  }
  ctx.fillStyle="#222";ctx.fillRect(0,0,W,70);
  ctx.fillStyle="#777";ctx.font="bold 15px Arial";ctx.textAlign="center";
  ctx.fillText(state==="fight"?"WEREWOLF HUNT":"THE ROOM",W/2,42);

  // papers
  if(state==="investigate"||state==="choice"){
    drawPaper(W*.18,H*.55,0);drawPaper(W*.82,H*.55,1);
  }
  humans.forEach((h,i)=>{if(h.alive)drawHuman(h,i)});
  drawPlayer();
  bullets.forEach(b=>{ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()});
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="#ddd";ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1});
  if(state==="fight"){
    ctx.fillStyle="#222";ctx.fillRect(20,H-25,180,10);
    ctx.fillStyle="#ddd";ctx.fillRect(20,H-25,180*Math.max(0,player.hp/100),10);
    ctx.fillStyle="#ddd";ctx.font="13px Arial";ctx.textAlign="left";ctx.fillText("HP "+Math.max(0,Math.ceil(player.hp)),20,H-35);
  }
}
function drawPaper(x,y,i){
  ctx.save();ctx.translate(x,y);ctx.rotate(i?.08:-.08);
  ctx.fillStyle="#c8c0a5";ctx.fillRect(-45,-35,90,70);
  ctx.strokeStyle="#514d43";ctx.strokeRect(-45,-35,90,70);
  ctx.strokeStyle="#777";for(let j=-18;j<25;j+=12){ctx.beginPath();ctx.moveTo(-32,j);ctx.lineTo(32,j);ctx.stroke()}
  ctx.fillStyle="#222";ctx.font="11px monospace";ctx.textAlign="center";ctx.fillText("ENCRYPTED",0,-3);
  ctx.restore();
}
function drawHuman(h,i){
  ctx.save();ctx.translate(h.x,h.y);
  if(h.wolfForm){
    ctx.fillStyle="#7e7e7e";ctx.beginPath();ctx.arc(0,0,35,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#ddd";ctx.beginPath();ctx.moveTo(-30,-22);ctx.lineTo(-17,-52);ctx.lineTo(-5,-30);ctx.moveTo(30,-22);ctx.lineTo(17,-52);ctx.lineTo(5,-30);ctx.fill();
    ctx.fillStyle="#d22";ctx.beginPath();ctx.arc(-12,-5,5,0,Math.PI*2);ctx.arc(12,-5,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#eee";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.fillText("WEREWOLF",0,62);
  }else{
    ctx.fillStyle=h.color;ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#181a1d";ctx.fillRect(-18,22,36,35);
    ctx.fillStyle="#eee";ctx.font="bold 14px Arial";ctx.textAlign="center";ctx.fillText(h.name,0,-38);
    if(selected===i){ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,36,0,Math.PI*2);ctx.stroke()}
  }
  ctx.restore();
}
function drawPlayer(){
  ctx.save();ctx.translate(player.x,player.y);
  ctx.fillStyle="#ddd";ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#111";ctx.fillRect(-15,18,30,28);
  ctx.fillStyle="#aaa";ctx.fillRect(13,-4,26,8);
  ctx.restore();
}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  if(state==="investigate")updateInvestigate(dt);
  if(state==="fight")updateFight(dt);
  updateParticles(dt);draw();
  if(state!=="ended")requestAnimationFrame(loop);
}
</script>
</body>
</html>
